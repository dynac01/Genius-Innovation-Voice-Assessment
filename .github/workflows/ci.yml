name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs with no secrets, by design. The fakes drive every control-flow test, so
# the suite proves the loop's behaviour without live audio or a paid provider.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from the `packageManager` field in package.json — the same
      # source corepack and the devcontainer use. Pinning it here too would be a
      # second source of truth, free to drift.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test (unit + feature)
        run: pnpm test

  # E2E is a separate job so a browser download never sits on the critical path of
  # the fast feedback loop. It is deliberately thin — see docs/TESTING.md.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from the `packageManager` field in package.json — the same
      # source corepack and the devcontainer use. Pinning it here too would be a
      # second source of truth, free to drift.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm test:e2e:install

      - name: Test (e2e)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The deploy artefact. Building it in CI means a broken Dockerfile is caught
  # here rather than at deploy time, when it blocks a release.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: voice-conversation:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves the app and answers /health
        run: |
          docker run -d --name voice -p 8787:8787 voice-conversation:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8787/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8787/ | grep -qi '<!doctype html'
          docker logs voice
          docker rm -f voice
