name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs with no secrets, by design. The fakes drive every control-flow test, so
# the suite proves the loop's behaviour without live audio or a paid provider.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from the `packageManager` field in package.json — the same
      # source corepack and the devcontainer use. Pinning it here too would be a
      # second source of truth, free to drift.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test (unit + feature)
        run: pnpm test

  # E2E is a separate job so a browser download never sits on the critical path of
  # the fast feedback loop. It is deliberately thin — see docs/TESTING.md.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from the `packageManager` field in package.json — the same
      # source corepack and the devcontainer use. Pinning it here too would be a
      # second source of truth, free to drift.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm test:e2e:install

      - name: Test (e2e)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
